<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Phrase Cards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0b0f1c;
      --surface: #111827;
      --surface2:#1a2340;
      --border:  #1e2b4a;
      --accent:  #6366f1;
      --accenth: #818cf8;
      --gold:    #facc15;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --danger:  #ef4444;
      --green:   #22c55e;
      --orange:  #ea580c;
      --radius:  12px;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 13px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    header h1 {
      font-size: 1.1rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accenth), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #count-label { color: var(--muted); font-size: .82rem; margin-left: auto; }

    /* ── Layout ── */
    .layout { flex: 1; display: flex; overflow: hidden; }

    /* ── Left: phrase list ── */
    .phrase-list {
      width: 310px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--surface);
    }
    .phrase-list::-webkit-scrollbar { width: 5px; }
    .phrase-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .phrase-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
      user-select: none;
    }
    .phrase-item:hover  { background: var(--surface2); }
    .phrase-item.active { background: #1c2b5e; border-left: 3px solid var(--accent); }

    .phrase-num {
      flex-shrink: 0;
      width: 28px; height: 28px;
      background: #2e3a6e;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; color: var(--accenth);
    }
    .phrase-item.active .phrase-num { background: var(--accent); color: #fff; }
    .phrase-item.done   .phrase-num { background: #14532d; color: var(--green); }

    .phrase-meta { overflow: hidden; flex: 1; }
    .phrase-name {
      font-size: .86rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .phrase-trans {
      font-size: .71rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* Generate button per phrase */
    .btn-gen {
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .15s;
    }
    .btn-gen:active { transform: scale(.9); }

    .btn-gen.pending {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: .78rem;
    }
    .btn-gen.pending:hover { background: var(--accenth); }

    .btn-gen.done {
      height: 26px;
      border-radius: 6px;
      padding: 0 9px;
      font-size: .7rem; font-weight: 600;
      white-space: nowrap;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accenth);
    }
    .btn-gen.done:hover { border-color: var(--accent); color: #fff; background: #1c2b5e; }

    .btn-gen.loading {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      cursor: not-allowed;
    }
    .btn-gen.loading::after {
      content: '';
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Right: detail panel ── */
    .detail-panel {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .detail-panel::-webkit-scrollbar { width: 5px; }
    .detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Spinner bar */
    .spinner-bar {
      display: none;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .88rem;
      flex-shrink: 0;
    }
    .spinner-dot {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: var(--muted); font-size: .9rem;
    }
    .empty-icon { font-size: 3rem; opacity: .3; }

    .error-box {
      width: 100%; max-width: 800px;
      margin: 16px 0 0;
      background: #1f0707;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      color: #fca5a5;
      padding: 12px 16px;
      font-size: .88rem;
      display: none;
    }

    /* ── Detail view ── */
    #phrase-detail {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 840px;
      padding: 28px 24px 60px;
      gap: 18px;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .detail-title {
      font-size: 1.6rem; font-weight: 700; color: var(--gold);
      line-height: 1.2;
    }
    .detail-trans { font-size: .95rem; color: #93c5fd; margin-top: 4px; }
    .detail-num {
      flex-shrink: 0;
      font-size: .78rem; color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      margin-top: 4px;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }
    .card-toolbar {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: .7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted);
    }

    img.detail-img   { width: 100%; border-radius: 8px; display: block; }
    video.detail-vid { width: 100%; border-radius: 8px; display: block; background: #000; }
    audio            { width: 100%; accent-color: var(--accent); }

    /* Buttons */
    .btn {
      cursor: pointer; border: none; border-radius: 8px;
      font-size: .82rem; font-weight: 600; padding: 7px 16px;
      transition: transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-dl {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-dl:hover { border-color: var(--accent); color: var(--accenth); }
    .btn-zip {
      background: #1e3a5f;
      border: 1px solid #2e4a8f;
      color: #93c5fd;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-zip:hover { border-color: var(--accenth); color: var(--accenth); }
  </style>
</head>
<body>

<header>
  <h1>English Phrase Cards</h1>
  <span id="count-label"></span>
</header>

<div class="layout">

  <!-- Left: phrase list -->
  <div class="phrase-list" id="phrase-list"></div>

  <!-- Right: detail panel -->
  <div class="detail-panel">

    <div class="spinner-bar" id="spinner">
      <div class="spinner-dot"></div>
      <span id="spinner-msg">Generating…</span>
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📖</div>
      <div>Click <strong>▶</strong> next to a phrase to generate its card</div>
    </div>

    <div id="phrase-detail">
      <div class="detail-header">
        <div>
          <div class="detail-title" id="d-phrase"></div>
          <div class="detail-trans"  id="d-trans"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <span class="detail-num" id="d-num"></span>
          <button class="btn btn-zip" id="d-zip-btn" onclick="dlZip()">&#8681; Download ZIP</button>
        </div>
      </div>

      <!-- Video -->
      <div class="card">
        <div class="card-toolbar">
          <span class="card-label">Video &middot; 1080 &times; 1440</span>
          <button class="btn btn-dl" onclick="dl('video')">&#8681; MP4</button>
        </div>
        <video class="detail-vid" id="d-video" controls preload="auto"></video>
      </div>

      <!-- Image -->
      <div class="card">
        <div class="card-toolbar">
          <span class="card-label">Image &middot; 1080 &times; 1440</span>
          <button class="btn btn-dl" onclick="dl('image')">&#8681; PNG</button>
        </div>
        <img class="detail-img" id="d-img" alt="" />
      </div>

      <!-- Audio -->
      <div class="card">
        <div class="card-toolbar">
          <span class="card-label">Audio</span>
          <button class="btn btn-dl" onclick="dl('audio')">&#8681; MP3</button>
        </div>
        <audio id="d-audio" controls preload="auto"></audio>
      </div>
    </div>

  </div>
</div>

<script>
  // idx → server response {phrase, translation, number, filename, image_url, audio_url, video_url}
  const resultData = {};
  const generated  = new Set();
  let   currentIdx = null;
  let   loadingIdx = null;

  async function init() {
    const [pr, gr] = await Promise.all([fetch("/phrases"), fetch("/generated")]);
    const phrases  = await pr.json();
    const restored = await gr.json();

    renderList(phrases);

    for (const d of restored) {
      resultData[d.index] = d;
      generated.add(d.index);
      setGenBtn(d.index, "done");
    }

    // Show most recently generated (highest index) if any
    if (restored.length > 0) {
      const last = restored.reduce((a, b) => (a.number > b.number ? a : b));
      showDetail(last.index);
    }
  }

  function renderList(phrases) {
    document.getElementById("count-label").textContent =
      `${phrases.length} phrase${phrases.length !== 1 ? "s" : ""}`;

    const list = document.getElementById("phrase-list");
    list.innerHTML = "";

    phrases.forEach((p, i) => {
      const el = document.createElement("div");
      el.className     = "phrase-item";
      el.dataset.index = i;
      el.innerHTML = `
        <div class="phrase-num">${p.number}</div>
        <div class="phrase-meta">
          <div class="phrase-name">${esc(p.phrase)}</div>
          ${p.translation ? `<div class="phrase-trans">${esc(p.translation)}</div>` : ""}
        </div>
        <button class="btn-gen pending" id="gen-btn-${i}"
                title="Generate" onclick="handleGenBtn(event,${i})">&#9654;</button>`;

      // Clicking the row (not the button) navigates to detail if generated
      el.addEventListener("click", (e) => {
        if (e.target.closest(".btn-gen")) return;
        if (generated.has(i)) showDetail(i);
      });

      list.appendChild(el);
    });
  }

  function handleGenBtn(e, idx) {
    e.stopPropagation();
    if (loadingIdx !== null) return;
    generate(idx);
  }

  async function generate(idx) {
    loadingIdx = idx;
    setGenBtn(idx, "loading");
    hideError();
    showSpinner(`Generating image, audio & video for phrase #${idx + 1}…`);

    // Keep detail panel showing last result while loading
    if (currentIdx === null) {
      hide("empty-state");
      hide("phrase-detail");
    }

    try {
      const res  = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index: idx }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "Server error");

      resultData[idx] = data;
      generated.add(idx);
      setGenBtn(idx, "done");
      showDetail(idx);

      triggerDownload(data.video_url, `${data.filename}.mp4`);

    } catch (err) {
      showError(err.message);
      setGenBtn(idx, "pending");
      if (currentIdx === null) show("empty-state");
    } finally {
      hideSpinner();
      loadingIdx = null;
    }
  }

  function showDetail(idx) {
    const d = resultData[idx];
    if (!d) return;
    currentIdx = idx;

    document.getElementById("d-phrase").textContent = `"${d.phrase}"`;
    document.getElementById("d-trans").textContent  = d.translation ? `(${d.translation})` : "";
    document.getElementById("d-num").textContent    = `#${String(d.number).padStart(2, "0")}`;
    document.getElementById("d-img").src            = d.image_url;
    document.getElementById("d-audio").src          = d.audio_url;
    document.getElementById("d-video").src          = d.video_url;

    hide("empty-state");
    document.getElementById("phrase-detail").style.display = "flex";

    // Highlight active in list
    document.querySelectorAll(".phrase-item").forEach(el => {
      const active = +el.dataset.index === idx;
      el.classList.toggle("active", active);
      if (active) el.classList.add("done");
    });
  }

  function setGenBtn(idx, state) {
    const btn = document.getElementById(`gen-btn-${idx}`);
    if (!btn) return;
    btn.className = `btn-gen ${state}`;
    if (state === "pending")  { btn.innerHTML = "&#9654;"; btn.title = "Generate"; }
    if (state === "done")     { btn.innerHTML = "&#8635; Regenerate"; btn.title = "Regenerate"; }
    if (state === "loading")  { btn.innerHTML = ""; btn.title = "Generating…"; }
  }

  function dl(type) {
    if (currentIdx === null) return;
    const d = resultData[currentIdx];
    const map = {
      image: [d.image_url, `${d.filename}.png`],
      audio: [d.audio_url, `${d.filename}.mp3`],
      video: [d.video_url, `${d.filename}.mp4`],
    };
    triggerDownload(...map[type]);
  }

  function dlZip() {
    if (currentIdx === null) return;
    const d = resultData[currentIdx];
    triggerDownload(`/zip/${currentIdx}`, `${d.filename}.zip`);
  }

  function triggerDownload(url, name) {
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function showSpinner(msg) {
    document.getElementById("spinner-msg").textContent = msg;
    document.getElementById("spinner").style.display = "flex";
  }
  function hideSpinner() { document.getElementById("spinner").style.display = "none"; }
  function showError(msg) {
    const el = document.getElementById("error-box");
    el.textContent = `Error: ${msg}`; el.style.display = "block";
  }
  function hideError() { document.getElementById("error-box").style.display = "none"; }
  function show(id)  { document.getElementById(id).style.display = "flex"; }
  function hide(id)  { document.getElementById(id).style.display = "none"; }
  function esc(s)    {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  init();
</script>
</body>
</html>
